name: Desktop

on:
  push:
    branches: [main, codex/rust-tauri]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:frontend
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run test:rust
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - run: npm test
        env:
          CURRYCLIENT_EXECUTABLE: ${{ github.workspace }}\src-tauri\target\debug\curryclient.exe
      - run: npm run dist:win -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: CurryClient-Windows-Tauri
          path: |
            src-tauri/target/release/curryclient.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
