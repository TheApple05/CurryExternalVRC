name: Catalog diagnostics

on:
  push:
    branches: [codex/linux-avatar-search]

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-22.04
    steps:
      - name: Compare documented JSON request headers
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          url = 'https://api.avtrdb.com/v2/avatar/random?page_size=1'
          for accept in [None, 'application/json']:
              headers = {'User-Agent': 'CurryClient/2.0.1'}
              if accept: headers['Accept'] = accept
              try:
                  response = urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  body = response.read(4096).decode('utf-8', errors='replace')
                  title = re.search(r'<title>([^<]*)</title>', body, re.I)
                  print(json.dumps({'accept': accept, 'status': response.status, 'type': response.headers.get('Content-Type'), 'server': response.headers.get('Server'), 'title': title.group(1) if title else None}))
          PY
