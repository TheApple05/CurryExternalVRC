[package]
name = "curryclient"
version = "2.0.2"
description = "Rust and Tauri VRChat companion"
authors = ["CurryClient contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/TheApple05/CurryExternalVRC"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
tempfile = "3"
